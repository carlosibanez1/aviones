<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Procesadores de Ordenador</title>

<style>

body{
font-family: Arial;
background:#f2f2f2;
text-align:center;
}

h1{
background:#222;
color:white;
padding:20px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.cpu{
background:white;
padding:20px;
width:200px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
cursor:pointer;
transition:0.3s;
}

.cpu:hover{
transform:scale(1.05);
}

#info{
margin-top:40px;
background:white;
padding:20px;
width:60%;
margin-left:auto;
margin-right:auto;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<h1>Comparador de Procesadores</h1>

<p>Haz clic en un procesador para ver sus características</p>

<div class="container">

<div class="cpu" onclick="mostrar('i9')">
Intel i9-13900K
</div>

<div class="cpu" onclick="mostrar('i5')">
Intel i5-12400F
</div>

<div class="cpu" onclick="mostrar('r9')">
Ryzen 9 7950X
</div>

<div class="cpu" onclick="mostrar('r5')">
Ryzen 5 5600X
</div>

<div class="cpu" onclick="mostrar('m2')">
Apple M2
</div>

<div class="cpu" onclick="mostrar('pentium')">
Pentium Gold G6400
</div>

</div>

<div id="info">
Aquí aparecerá la información del procesador.
</div>

<script>

function mostrar(cpu){

let texto="";

if(cpu=="i9"){
texto=`
<h2>Intel Core i9-13900K</h2>

<b>Características:</b>
<ul>
<li>24 núcleos</li>
<li>32 hilos</li>
<li>Hasta 5.8 GHz</li>
<li>Arquitectura Raptor Lake</li>
</ul>

<b>Aporta al ordenador:</b>
Gran potencia para gaming, edición de vídeo y trabajo profesional.

<b>Puntos fuertes:</b>
<ul>
<li>Extremo rendimiento</li>
<li>Muy bueno para multitarea</li>
<li>Excelente en juegos</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>Consume mucha energía</li>
<li>Genera bastante calor</li>
<li>Precio alto</li>
</ul>
`;
}

if(cpu=="i5"){
texto=`
<h2>Intel Core i5-12400F</h2>

<b>Características:</b>
<ul>
<li>6 núcleos</li>
<li>12 hilos</li>
<li>Hasta 4.4 GHz</li>
</ul>

<b>Aporta al ordenador:</b>
Buen equilibrio entre precio y rendimiento.

<b>Puntos fuertes:</b>
<ul>
<li>Muy buen rendimiento en juegos</li>
<li>Precio accesible</li>
<li>Bajo consumo</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>No tiene gráficos integrados</li>
<li>Menos potencia para trabajos pesados</li>
</ul>
`;
}

if(cpu=="r9"){
texto=`
<h2>AMD Ryzen 9 7950X</h2>

<b>Características:</b>
<ul>
<li>16 núcleos</li>
<li>32 hilos</li>
<li>Hasta 5.7 GHz</li>
</ul>

<b>Aporta al ordenador:</b>
Rendimiento extremo para tareas profesionales.

<b>Puntos fuertes:</b>
<ul>
<li>Excelente para renderizado</li>
<li>Muy potente en multitarea</li>
<li>Gran eficiencia</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>Precio elevado</li>
<li>Necesita buena refrigeración</li>
</ul>
`;
}

if(cpu=="r5"){
texto=`
<h2>AMD Ryzen 5 5600X</h2>

<b>Características:</b>
<ul>
<li>6 núcleos</li>
<li>12 hilos</li>
<li>Hasta 4.6 GHz</li>
</ul>

<b>Aporta al ordenador:</b>
Buen rendimiento para gaming y uso general.

<b>Puntos fuertes:</b>
<ul>
<li>Muy eficiente</li>
<li>Buen precio</li>
<li>Gran rendimiento en juegos</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>No tiene gráficos integrados</li>
<li>Menos potente que modelos superiores</li>
</ul>
`;
}

if(cpu=="m2"){
texto=`
<h2>Apple M2</h2>

<b>Características:</b>
<ul>
<li>8 núcleos CPU</li>
<li>Arquitectura ARM</li>
<li>Alta eficiencia energética</li>
</ul>

<b>Aporta al ordenador:</b>
Gran rendimiento con muy bajo consumo.

<b>Puntos fuertes:</b>
<ul>
<li>Muy eficiente</li>
<li>Excelente para portátiles</li>
<li>Gran optimización con macOS</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>No se puede actualizar</li>
<li>Solo funciona en dispositivos Apple</li>
</ul>
`;
}

if(cpu=="pentium"){
texto=`
<h2>Intel Pentium Gold G6400</h2>

<b>Características:</b>
<ul>
<li>2 núcleos</li>
<li>4 hilos</li>
<li>4.0 GHz</li>
</ul>

<b>Aporta al ordenador:</b>
Procesador básico para tareas simples.

<b>Puntos fuertes:</b>
<ul>
<li>Muy barato</li>
<li>Bajo consumo</li>
<li>Suficiente para oficina y navegación</li>
</ul>

<b>Puntos débiles:</b>
<ul>
<li>Muy poca potencia</li>
<li>No sirve para juegos modernos</li>
</ul>
`;
}

document.getElementById("info").innerHTML=texto;

}

</script>

</body>
</html>
